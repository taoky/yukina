image: ustcmirror/yukina:latest
envs:
  YUKINA_SIZE_LIMIT: 512g
  YUKINA_FILTER: --filter ^buildid/[0-9a-f]+/(debuginfo|executable)$
  YUKINA_EXTRA: --strip-prefix /debian --size-request-method get --min-vote-count 1
  YUKINA_REPO: debuginfod
  UPSTREAM: https://debuginfod.debian.net/
cron: 30 7 * * *
logRotCycle: 50
name: debuginfod-debian
storageDir: /srv/repo/debuginfod/debian/
volumes:
  /var/log/nginx/cacheproxy: /nginx-log:ro
