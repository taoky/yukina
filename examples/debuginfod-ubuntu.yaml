image: ustcmirror/yukina:latest
envs:
  YUKINA_SIZE_LIMIT: 512g
  YUKINA_FILTER: --filter ^buildid/[0-9a-f]+/(debuginfo|executable)$
  YUKINA_EXTRA: --strip-prefix /ubuntu --size-request-method get --min-vote-count 1
  YUKINA_REPO: debuginfod
  UPSTREAM: https://debuginfod.ubuntu.com/
cron: 10 7 * * *
logRotCycle: 50
name: debuginfod-ubuntu
storageDir: /srv/repo/debuginfod/ubuntu/
volumes:
  /var/log/nginx/cacheproxy: /nginx-log:ro
