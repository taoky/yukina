image: ustcmirror/yukina:latest
envs:
  YUKINA_SIZE_LIMIT: 512g
  YUKINA_FILTER: --filter ^buildid/[0-9a-f]+/(debuginfo|executable)$
  YUKINA_EXTRA: --strip-prefix /archlinux --size-request-method get --min-vote-count 1
  YUKINA_REPO: debuginfod
  UPSTREAM: https://debuginfod.archlinux.org/
cron: 50 7 * * *
logRotCycle: 50
name: debuginfod-archlinux
storageDir: /srv/repo/debuginfod/archlinux/
volumes:
  /var/log/nginx/cacheproxy: /nginx-log:ro
